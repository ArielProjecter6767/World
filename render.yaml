services:
  - type: web
    name: aether-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: aether_ai
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_IMAGE_MODEL
        value: '@cf/black-forest-labs/flux-1-schnell'
      - key: CESIUM_ION_TOKEN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
